      name: Radar LatAm

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Forzar envío de email aunque no sea lunes"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar radar
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email }}
        run: python latam_radar.py

      - name: Guardar resultados actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/cache.json data/results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática del radar"
          git push
